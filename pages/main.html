<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../styles/main-style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>Light Bulb Clicker</title>
        
    </head>
    <body>
        <header>
            <h1>Light bulb clicker</h1>
        </header>
         <main>
            <div class="timer-elements">
                <p id="announcement"></p>
                <p id="timer-text">Time left: <span id="timer"></span></p>
            </div>
            <div id="main-screen">
                <img class="active" id="switchOff" src="../media/switch_off.png">
                <img id="switchOn" src="../media/switch_on.png">
                <img class="active" id="lightOff" src="../media/light_off.png">
                <img id="lightOn" src="../media/light_on.png">
            </div>
            <p id="countText">Collected <span id="challengeCount"></span> clicks</p>
            <p id="click-count">0</p>

            <div class="rectangle">
                <h2>Shop</h2>
                <button id="buyStepBttn">Double step for 500 points</button>
                <button id="buyAutoClickBttn">Add autoclick with step 1 for 800</button>
                <button id="gambleBttn">Gamble with 100 clicks</button>
                <div id="bonus-container">
                    <h2>Free bonuses</h2>
                </div>
            </div>
            
         </main>  
        <script src="../scripts/script.js"></script>   
    </body>
</html>
