<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../styles/main-style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>Light Bulb Clicker</title>
        
    </head>
    <body>
        <header>
            <h1>Light bulb clicker</h1>
        </header>
         <main>

            <p class="announcement"></p>

            <div id="main-screen" class="elements-layout">
                <img class="active" id="switchOff" src="../media/switch_off.png">
                <img id="switchOn" src="../media/switch_on.png">
                <img class="active" id="lightOff" src="../media/light_off.png">
                <img id="lightOn" src="../media/light_on.png">
            </div>
            <p id="click-count">0</p>

            
           
            <p class="hiddenElement">Time left: <span id="timer"></span></p>

            <div class="rectangle">
                <h2>Shop</h2>
                <button id="buyStepBttn">Buy step * 2 for 1000 points</button>
                <button id="buyAutoClickBttn"></button>
            </div>
            
         </main>  
        <script src="../scripts/script.js"></script>   
    </body>
</html>
